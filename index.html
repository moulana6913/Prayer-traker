<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>தொழுகை மாதாந்திர கணக்கு</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f2f6f3;margin:0;padding:12px}
h2{text-align:center;color:#08764b;font-size:22px}
.top{text-align:center;margin:15px 0}
input{padding:10px;border:1px solid #aaa;border-radius:8px;font-size:16px}
button{display:inline-block;padding:12px 16px;margin:8px 4px;background:#08764b;color:white;border:0;border-radius:8px;font-size:16px;font-weight:bold}
.legend{text-align:center;margin:12px 0;font-size:13px;line-height:2}
.table-wrap{overflow-x:auto;background:white;border-radius:10px}
table{width:100%;min-width:520px;border-collapse:collapse;background:white}
th,td{border:1px solid #ddd;padding:9px 5px;text-align:center}
th{background:#08764b;color:white;font-size:13px}
td:first-child{font-weight:bold}
.mark{font-size:22px;font-weight:bold;cursor:pointer;color:#888;display:inline-block;min-width:28px}
.done{color:green}.missed{color:red}
@media print{
 body{background:white;padding:5px}
 .top button{display:none}
 .table-wrap{overflow:visible}
 table{min-width:0;width:100%;font-size:11px}
 th,td{padding:6px 3px}
 .mark{font-size:17px}
 @page{size:A4 portrait;margin:10mm}
}
</style>
</head>
<body>
<h2>📅 தொழுகை மாதாந்திர கணக்கு</h2>
<div class="top">
  <input type="month" id="month">
  <button type="button" id="pdfBtn">📄 PDF Download / Print</button>
</div>
<div class="legend">
<span style="color:green">✓ தொழுதேன்</span> |
<span style="color:red">✗ தொழவில்லை</span> |
<span style="color:#888">○ பதிவு இல்லை</span>
<br>ஒவ்வொரு குறியீட்டையும் தொட்டு மாற்றலாம்.
</div>
<div class="table-wrap">
<table>
<thead><tr><th>தேதி</th><th>Fajr</th><th>Luhar</th><th>Asar</th><th>Magrib</th><th>Isha</th></tr></thead>
<tbody id="days"></tbody>
</table>
</div>
<script>
const month=document.getElementById("month");
const days=document.getElementById("days");
const now=new Date();
month.value=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
function createTable(){
 days.innerHTML="";
 if(!month.value)return;
 const [year,mon]=month.value.split("-").map(Number);
 const total=new Date(year,mon,0).getDate();
 for(let d=1;d<=total;d++){
  const tr=document.createElement("tr");
  const dateCell=document.createElement("td");dateCell.textContent=d;tr.appendChild(dateCell);
  for(let p=0;p<5;p++){
   const td=document.createElement("td");
   const key=`prayer-${month.value}-${d}-${p}`;
   let value=localStorage.getItem(key)||"○";
   const span=document.createElement("span");
   span.className="mark";span.textContent=value;updateColor(span,value);
   span.onclick=()=>{
    value=({"○":"✓","✓":"✗","✗":"○"})[value];
    localStorage.setItem(key,value);span.textContent=value;updateColor(span,value);
   };
   td.appendChild(span);tr.appendChild(td);
  }
  days.appendChild(tr);
 }
}
function updateColor(el,value){
 el.className="mark";
 if(value==="✓")el.classList.add("done");
 if(value==="✗")el.classList.add("missed");
}
month.addEventListener("change",createTable);
document.getElementById("pdfBtn").addEventListener("click",()=>window.print());
createTable();
</script>
</body>
</html>
